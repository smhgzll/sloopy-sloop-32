<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#1e1e1e"/></linearGradient>
  <style>
    .label{font:14px Arial,sans-serif;fill:#e8e8e8;text-anchor:middle}.small{font:11px Arial,sans-serif;fill:#ddd;text-anchor:middle}
    .btn{fill:#1b1b1b;stroke:#555;stroke-width:2}.knob{fill:#111;stroke:#777;stroke-width:3}.key{fill:#111;stroke:#555;stroke-width:2}
  </style>
</defs>
<rect width="1200" height="700" fill="#f3f3f3"/>
<rect x="85" y="105" width="1030" height="490" rx="55" fill="url(#body)" stroke="#111" stroke-width="4"/>

